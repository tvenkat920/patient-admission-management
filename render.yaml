databases:
  - name: medicare-patient-db
    databaseName: patient_admission
    user: medicare_admin
    plan: free
    region: oregon

services:
  # Backend FastAPI Service (Render Free Tier + Persistent Free PostgreSQL)
  - type: web
    name: medicare-patient-api-tvenkat920
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: SEED_IF_EMPTY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-patient-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://tvenkat920.github.io,https://medicare-patient-admission.netlify.app,http://localhost:5173
