services:
  # Backend FastAPI Service with Persistent SQLite Disk
  - type: web
    name: patient-admission-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/patients.db
      - key: CORS_ORIGINS
        value: https://tvenkat920.github.io,https://tvenkat920.github.io/patient-admission-management,http://localhost:5173
